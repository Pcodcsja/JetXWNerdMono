# Pico Build Configuration

# Font metadata
font:
  family_name: "Pico"
  version: "1.8"
  author: "Pcodcsja (Pico derivative maintainer)"
  copyright: "Copyright (c) 2026 Pcodcsja (Pico modifications). Source font copyright notices are retained."
  description: "Pico is an independently maintained 2:1 CJK monospace derivative based on JetBrains Mono Nerd Fonts, LXGW WenKai Mono GB Screen and LXGW ZhenKai GB. Not an official release of the source projects."
  url: "https://github.com/Pcodcsja/PicoMono"
  license: "This Font Software is licensed under the SIL Open Font License, Version 1.1. See OFL.txt and the accompanying source license notices."
  license_url: "https://openfontlicense.org"

# Source fonts directory
#
# Bundled source versions:
# - JetBrains Mono Nerd Font v3.5.1
# - LXGW WenKai Mono GB Screen v1.530
# - LXGW ZhenKai GB v0.825 (latest release with the GB-Regular asset)
fonts_dir: "fonts"

# Styles configuration
# Each style maps: en_font (English), cn_font (CJK), display_name (metadata)
styles:
  Regular:
    en_font: "JetBrainsMonoNLNerdFontMono-Regular.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Regular"
  Italic:
    en_font: "JetBrainsMonoNLNerdFontMono-Italic.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Italic"
  Medium:
    en_font: "JetBrainsMonoNLNerdFontMono-Medium.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Medium"
  MediumItalic:
    en_font: "JetBrainsMonoNLNerdFontMono-MediumItalic.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Medium Italic"
  Bold:
    en_font: "JetBrainsMonoNLNerdFontMono-Bold.ttf"
    cn_font: "LXGWZhenKaiGB-Regular.ttf"
    display_name: "Bold"
  BoldItalic:
    en_font: "JetBrainsMonoNLNerdFontMono-BoldItalic.ttf"
    cn_font: "LXGWZhenKaiGB-Regular.ttf"
    display_name: "Bold Italic"

# Build options
build:
  styles: "Regular,Medium,Italic,MediumItalic,Bold,BoldItalic"  # Comma-separated
  output_dir: "output/fonts"
  parallel: 6  # Number of parallel workers

# Glyph width configuration (2:1 ratio)
width:
  en_width: 600
  cn_width: 1200
  # CJK visual scale factor (1.0 = no extra scaling, 1.08 = 8% larger)
  visual_scale: 1.08
